  - "429"
  - failover
description: "Companion to hermes-kame-api-rotation. Registers Hermes' own API-key chat-completions provider profiles again, unchanged except for create_client, so each request is served by KAME's rotating client: the healthiest key per call, every refusal read for what it says, and the next key instead of a failed turn. Without hermes-kame-api-rotation loaded, or for a request on another wire, it changes nothing: Hermes builds its usual client."
