name: hermes-kame-api-rotation
version: "1.3.3"
# Declared v2 in 1.0.9 for the marketplace metadata, and put back to 1 in
# 1.1.2 because the two halves of Hermes disagree about the number and only
# one of them is in the way of an install:
#
#   hermes_cli/plugins.py     SUPPORTED_MANIFEST_VERSION = 2  (the loader)
#   hermes_cli/plugins_cmd.py _SUPPORTED_MANIFEST_VERSION = 1 (the installer)
#
# The installer's copy is what `hermes plugins install <git url>` and the
# Desktop plugin dashboard both run, and it *raises* rather than warns:
# "requires manifest_version 2, but this installer only supports up to 1".
# Every plugin Hermes ships omits the field entirely, which means v1.
#
# Nothing is lost by saying 1: _parse_manifest_v2_fields reads license,
# homepage, tags, api_version and config_schema whatever this number says.
# It is only worth raising once the installer's own constant catches up.
manifest_version: 1
# The plugin *API generation*, not the Hermes version — two different numbers
# that 1.0.9 conflated. `"0.20"` made Hermes log
# `api_version '0.20' is not an integer; ignoring` on every boot, and
# `hermes plugins doctor` warns below 1. Every plugin Hermes ships declares 1.
api_version: 1
license: MIT
homepage: https://github.com/Kame696/kame-api-rotation-for-hermes
tags:
  - api
  - rotation
  - rate-limiting
  - reliability
  - keys
  - quota
  - multi-key
# One paragraph, because this is the text a person reads in a plugin list.
# The full account of what each release claims and how it was checked lives in
# README.md and DESIGN.md, which is where a reader can choose to go looking.
description: "Rotates your API keys on every single call, not only when one refuses, and waits out a spent quota instead of giving up on it. Paste several keys into one provider field, comma separated: Hermes stores them as one credential, and KAME reads them as the several keys they are. Before each request it picks the healthiest key — fewest requests in the last 60 seconds, least recently used to break the tie — so a pool of fifteen spreads fifteen ways instead of hammering the first. When a call fails it rests that key for exactly as long as the evidence justifies and takes the next one, without the error reaching your chat: a 503 outage, a read timeout, a per-minute throttle and an invalid key are four different waits, and only a genuinely bad request stops the turn. When every key is resting there is no time limit on how long it will wait for one — a daily quota that rolls at midnight is worth waiting for — and it says so while it waits, with the count of resting keys, the estimate, and how to cancel, so a long wait never looks like a freeze. Cooldowns are sized from what the provider actually said — retry timing in SDK exceptions, rate-limit headers and structured error bodies, which the built-in classifier does not read — except for a daily cap, whose retry hint is deliberately ignored because it lies. Remembers which model spent the quota, so a key exhausted on the main model keeps its allowance on a smaller one, and pulls the whole pool back early once an outage ends. A long outage is collapsed in the log instead of writing the same line a thousand times. No provider allowlist — it acts on evidence and declines what it cannot size, leaving Hermes' own classifier in charge. Adds /kame-keys for bulk import and /kame-quota for the per-key, per-model picture."
author: "Kame696"
# Every switch is also an environment variable, and the environment wins. The
# config entry exists because that is where Hermes keeps plugin switches and a
# knob nobody can find is a knob nobody has; the environment stays on top
# because KAME_ROTATION_DISABLED is the escape hatch, and an escape hatch a
# file can override is not one. Read once at registration — they are consulted
# on the classification and selection paths, and ctx.get_config re-reads
# config.yaml on every access.
config_schema:
  disabled:
    type: bool
    default: false
    description: "Turn KAME into a no-op without uninstalling it. Same as KAME_ROTATION_DISABLED=1."
  spread_disabled:
    type: bool
    default: false
    description: "Keep cooldown sizing but give Hermes its own key-selection order back. Same as KAME_SPREAD_DISABLED=1."
  field_probe_disabled:
    type: bool
    default: false
    description: "Give the Settings key field back the host's one-key check, which refuses a paste holding several keys. Same as KAME_FIELD_PROBE_DISABLED=1."
  resolver_disabled:
    type: bool
    default: false
    description: "Send a multi-key variable to the provider the way Hermes resolves it — the whole comma-joined list as one key. Same as KAME_RESOLVER_DISABLED=1."
  carousel_disabled:
    type: bool
    default: false
    description: "Stop choosing a key per call. Hermes' own key, retry ceiling and rotation rules come back; cooldown sizing stays. Same as KAME_CAROUSEL_DISABLED=1."
  storm_collapse_disabled:
    type: bool
    default: false
    description: "Write every rotation failure during an outage instead of collapsing the repeats into a periodic count. Same as KAME_STORM_COLLAPSE_DISABLED=1."
  daily_quota_cooldown_seconds:
    type: int
    default: 3600
    description: "How long a key rests after a daily or account-level refusal, whose own retry hint is ignored on purpose. Clamped to 1-86400. Same as KAME_DAILY_COOLDOWN."
  live_status_disabled:
    type: bool
    default: false
    description: "Stop showing pool health and the recovery countdown on the spinner line. Rotation is unchanged; only the status text goes away. Same as KAME_LIVE_STATUS_DISABLED."
  gemini_tool_call_fix_disabled:
    type: bool
    default: false
    description: "Stop repairing Gemini streams that merge two parallel calls to one tool into a single unparseable argument string, which Hermes reports as 'Response truncated due to output length limit'. The repair is applied only after a runtime self-check reproduces the merge on the installed adapter and proves the repair separates it; this switch turns it off outright. Same as KAME_GEMINI_TOOL_CALL_FIX_DISABLED."
  stream_silence_timeout_seconds:
    type: int
    default: 0
    description: "How long one attempt may deliver nothing before the socket read gives up and KAME takes the next key. Zero, the default, means never - Hermes' own 120s stands. Any other value is raised to at least 5. Left alone for a local endpoint, and never applied if you set HERMES_STREAM_READ_TIMEOUT yourself. Same as KAME_STREAM_SILENCE_TIMEOUT."
  # Named silent_stream_patience_seconds until 1.1.1, when it was renamed to say
  # what it is - a timeout, in seconds, on a silent stream. The old name is
  # still read, so an existing config keeps working; new configs should use the
  # entry above.
  silent_stream_patience_seconds:
    type: int
    default: 0
    description: "Deprecated name for stream_silence_timeout_seconds. Still read, so nothing breaks; prefer the new name."
  stream_stitch_disabled:
    type: bool
    default: false
    description: "Stop continuing an answer that was cut mid-stream. KAME normally resumes it on another key, prefilled with what you already saw, and trims whatever the model repeats, so the reply arrives as one piece. Turning this on hands the half-answer back to Hermes instead, which appends its own '[System: The previous response was cut off...]' note. Same as KAME_STREAM_STITCH_DISABLED."
  stream_resume_limit:
    type: int
    default: 3
    description: "How many times one request may continue a cut answer before what arrived is handed back as it is. Zero turns continuation off, same as stream_stitch_disabled. Clamped to 0-10. Same as KAME_STREAM_RESUME_LIMIT."
hooks:
  - transform_api_error_classification
  - on_session_reset
  - pre_api_request
  - post_api_request
# Declared separately from `hooks` because `hermes plugins doctor` validates
# registrations against this list, not against `hooks`.
provides_hooks:
  - transform_api_error_classification
  - on_session_reset
  - pre_api_request
  - post_api_request
