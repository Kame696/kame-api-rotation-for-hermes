# Does KAME still fit the Hermes that just shipped?
#
# Weekly, and on demand with any Hermes tag or branch. Installs that Hermes
# into a throwaway HERMES_HOME and runs the host witnesses from tools/:
# the host's own error corpus with and without KAME, the host facts KAME's
# non-decisions rest on, the Gemini error contracts (each with its negative
# control), and Hermes' own provider, pool, auxiliary and streaming suites
# with KAME's client handed out in every test home. No provider is contacted and no credential exists.
#
# A red run here is news about Hermes, not necessarily a bug in KAME: read
# the failing tool's own output, then DESIGN.md and HOST_ALERTS.md.
name: host-compat

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes tag or branch (default: newest release tag)"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Hermes v0.23.0 pins its runtime for Python 3.14 only (every pin carries
          # `python_version >= '3.14'`); on 3.12 it installs almost nothing and nothing imports.
          python-version: "3.14"

      - name: Fetch Hermes
        run: |
          REF="${{ github.event.inputs.hermes_ref || 'latest' }}"
          if [ "$REF" = "latest" ]; then
            # The newest STABLE release: vMAJOR.MINOR.PATCH only. Hermes also pushes date tags
            # (v2026.9.24) and release candidates; sorted together, an old date tag won "latest"
            # and this check ran against Hermes 0.21.5 while v0.23.0 was out.
            REF=$(git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent.git \
                  | awk -F/ '{print $3}' | grep -E '^v0\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          echo "Hermes ref: $REF"
          HOME_DIR="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HOME_DIR"
          git clone --depth 1 --branch "$REF" https://github.com/NousResearch/hermes-agent.git "$HOME_DIR/hermes-agent"
          echo "HERMES_REF=$REF" >> "$GITHUB_ENV"
          echo "HERMES_HOME=$HOME_DIR" >> "$GITHUB_ENV"
          echo "KAME_HERMES_ROOT=$HOME_DIR/hermes-agent" >> "$GITHUB_ENV"

      - name: Install Hermes into its own venv
        run: |
          cd "$KAME_HERMES_ROOT"
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          if grep -q '^\[dependency-groups\]' pyproject.toml; then
            # v0.23.0 and later: the test tools live in a dependency group, not in an extra.
            venv/bin/python -m pip install -e ".[anthropic,messaging]" --group dev --group test
          else
            venv/bin/python -m pip install -e ".[dev,anthropic,messaging]"
          fi
          venv/bin/python -m pytest --version
          venv/bin/python -m hermes_cli.main --version || true

      - name: Host facts, runtime and Gemini contracts
        run: $KAME_HERMES_ROOT/venv/bin/python -B tools/host_assumptions.py

      - name: Host error corpus with and without KAME
        run: $KAME_HERMES_ROOT/venv/bin/python -B tools/host_corpus.py

      - name: Host prose stripping
        run: $KAME_HERMES_ROOT/venv/bin/python -B tools/host_prose.py

      - name: Gemini error contracts (with negative controls)
        run: $KAME_HERMES_ROOT/venv/bin/python -B tools/host_gemini_contracts.py --host "$KAME_HERMES_ROOT" --out "$RUNNER_TEMP/gemini_contracts.json"

      - name: Hermes' own suites with KAME's client in every test home
        run: $KAME_HERMES_ROOT/venv/bin/python -B tools/host_suite_1819.py --hermes "$KAME_HERMES_ROOT"
